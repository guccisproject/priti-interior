# Publishes the website to GitHub Pages when Pages > Source is set to "GitHub Actions".
# (Not required when Source is "Deploy from a branch": the site files already sit in the repo root.)
# Only the public website files are published, never server code or data.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/priti-interior-website-v0mfvi]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.js
      - name: Collect public site files
        run: |
          mkdir _site
          cp *.html robots.txt sitemap.xml .nojekyll _site/
          cp -r assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
